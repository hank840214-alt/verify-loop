name: Verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: verify-loop tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create the empty Claude directory used by the real-home guard test
        run: mkdir -p "$HOME/.claude"
      - run: bash tests/run.sh
